      max_days_ahead: c.max_days_ahead, min_lead_hours: c.min_lead_hours, today: B.todayLocal(), now: B.now() };
  });
  route("GET", "/api/public/slots", null, (q) => {
    const c = B.DB.config, today = B.todayLocal();
    const party = Math.max(1, Math.min(c.group_capacity, +q.party || 1));
    const exclude = q.token ? fromToken(q.token).id : null;
    return { party, slots: B.computeSlots(q.from || today, q.to || B.addDays(today, c.max_days_ahead), party, exclude) };
  });
  route("POST", "/api/public/bookings", null, (q, body) => {
    const f = B.createBooking(body);
    B.byId("bookings", f.id).mine = true; // aparece em "Minhas visitas" na visão do candidato
    const inv = B.DB.invitations.find((i) => i.tour_group_id === f.tour_group_id && i.status === "enviado");
    return Object.assign(publicView(B.full(f.id)), { invited: inv ? B.byId("ambassadors", inv.ambassador_id).display_name : null });
  });
  route("GET", "/api/public/bookings/(?<tok>[\\w-]+)", null, (q, b, p) => publicView(B.full(fromToken(p.tok).id)));
  route("POST", "/api/public/bookings/(?<tok>[\\w-]+)/reschedule", null, (q, body, p) => publicView(B.reschedule(fromToken(p.tok).id, body.slot_start)));
  route("POST", "/api/public/bookings/(?<tok>[\\w-]+)/cancel", null, (q, body, p) => publicView(B.cancel(fromToken(p.tok).id, "candidate", null, body.reason)));
  route("POST", "/api/public/bookings/(?<tok>[\\w-]+)/confirm-attendance", null, (q, body, p) => {
    const bk = fromToken(p.tok);
    if (!ACTIVE.includes(bk.status)) throw new B.DomainError("Esta visita não está ativa.", "estado_invalido", 409);
    bk.presence_confirmed_at = B.now(); B.logEvent("booking", bk.id, "booking.presence_confirmed", "candidate");
    return publicView(B.full(bk.id));
  });
  route("GET", "/api/public/nps/(?<tok>[\\w-]+)", null, (q, b, p) => {
    const f = B.full(fromToken(p.tok).id), ms = B.parse(f.slot_start);
    return { first_name: B.firstName(f.full_name), answered: B.DB.nps.some((n) => n.booking_id === f.id), date_label: B.fmtDate(ms), ambassador: B.ambLabel(f), open: ms <= B.nowMs() };
  });
  route("POST", "/api/public/nps/(?<tok>[\\w-]+)", null, (q, body, p) => { B.submitNps(fromToken(p.tok).id, body); return { ok: true }; });
  route("GET", "/api/public/my-bookings", null, () => {
    // atalho do simulador: "sou candidato" lista as visitas criadas neste navegador e as de exemplo
    return { items: B.DB.bookings.slice().reverse().slice(0, 80).map((b) => { const f = B.full(b.id); return { token: tokenOf(b.id), protocol: f.protocol, name: f.full_name, status: f.status, slot_start: f.slot_start, mine: !!b.mine }; }) };
  });

  // embaixador
  function groupForAmb(g, ambId) {
    const ms = B.parse(g.slot_start);
    const people = B.groupBookings(g.id, false).filter((b) => !b.status.startsWith("cancelado")).map((b) => {
      const p = B.safeProfile(B.full(b.id)); const a = B.DB.attendance.find((x) => x.booking_id === b.id);
      p.attended = a ? !!a.attended : null; return p;
    });
    const gift = B.DB.gifts.find((x) => x.tour_group_id === g.id && x.ambassador_id === ambId);
    return { group_id: g.id, slot_start: g.slot_start, date_label: B.fmtDate(ms), time_label: B.fmtTime(ms), status: g.status,
      people_count: people.filter((p) => p.status !== "nao_compareceu").reduce((s, p) => s + p.party_size, 0), people,
      gift_collected: !!(gift && gift.collected_at), has_gift: !!gift, is_today: B.lp(ms).date === B.todayLocal(), is_past: ms < B.nowMs(), can_mark: ms - 30 * 60e3 <= B.nowMs() };
  }
  route("GET", "/api/ambassador/me", "ambassador", () => {
    const a = myAmb(), u = me();
    const stale = !a.availability_updated_at || B.parse(a.availability_updated_at) < B.nowMs() - 30 * D;
    return { ambassador: a, availability_stale: stale, grid: { weekdays: B.DB.config.weekdays, start_times: B.DB.config.start_times },
      courses: B.DB.courses.filter((c) => c.active).map((c) => c.name), languages: B.DB.config.languages, email: u.email };
  });
  route("GET", "/api/ambassador/stats", "ambassador", () => B.ambassadorStats(myAmb().id));
  route("GET", "/api/ambassador/opportunities", "ambassador", () => B.ambassadorOpportunities(myAmb().id));
  route("POST", "/api/ambassador/opportunities/(?<id>\\d+)/claim", "ambassador", (q, b, p) => { B.claimGroup(+p.id, myAmb().id); return { ok: true }; });
  route("POST", "/api/ambassador/availability/add", "ambassador", (q, body) => {
    const a = myAmb();
    B.DB.exceptions = B.DB.exceptions.filter((e) => !(e.ambassador_id === a.id && e.date === body.date && e.start_time === body.start_time));
    B.insert("exceptions", { ambassador_id: a.id, date: body.date, start_time: body.start_time, available: true });
    a.availability_updated_at = B.now();
    return { ok: true };
  });
  route("PUT", "/api/ambassador/profile", "ambassador", (q, body) => { const a = myAmb(); Object.assign(a, { course: body.course || null, languages: body.languages || ["Português"], phone: body.phone || "" }); return { ok: true }; });
  route("GET", "/api/ambassador/availability", "ambassador", () => {
    const a = myAmb(), today = B.todayLocal();
    return { rules: B.DB.rules.filter((r) => r.ambassador_id === a.id), exceptions: B.DB.exceptions.filter((e) => e.ambassador_id === a.id && e.date >= today), updated_at: a.availability_updated_at };
  });
  route("PUT", "/api/ambassador/availability", "ambassador", (q, body) => {
    const a = myAmb(), today = B.todayLocal();
    B.DB.rules = B.DB.rules.filter((r) => r.ambassador_id !== a.id);
    (body.rules || []).forEach((r) => B.insert("rules", { ambassador_id: a.id, weekday: +r.weekday, start_time: r.start_time }));
    B.DB.exceptions = B.DB.exceptions.filter((e) => !(e.ambassador_id === a.id && e.date >= today));
    (body.exceptions || []).forEach((e) => B.insert("exceptions", { ambassador_id: a.id, date: e.date, start_time: e.start_time || null, available: !!e.available }));
    a.availability_updated_at = B.now();
    B.logEvent("ambassador", a.id, "availability.updated", "ambassador", a.id);
    return { ok: true };
  });
  route("GET", "/api/ambassador/invitations", "ambassador", () => {
    const a = myAmb();
    const invitations = B.DB.invitations.filter((i) => i.ambassador_id === a.id && i.status === "enviado").map((i) =>
      Object.assign(groupForAmb(B.byId("groups", i.tour_group_id), a.id), { invitation_id: i.id, expires_at: i.expires_at }));
    const recent = B.DB.invitations.filter((i) => i.ambassador_id === a.id && ["recusado", "expirado", "aceito", "desistiu"].includes(i.status)).slice(-10).reverse()
      .map((i) => ({ status: i.status, responded_at: i.responded_at, slot_start: B.byId("groups", i.tour_group_id).slot_start }));
    return { invitations, recent, now: B.now() };
  });
  route("POST", "/api/ambassador/invitations/(?<id>\\d+)/accept", "ambassador", (q, b, p) => { B.accept(+p.id, myAmb().id); return { ok: true }; });
  route("POST", "/api/ambassador/invitations/(?<id>\\d+)/decline", "ambassador", (q, body, p) => { B.decline(+p.id, myAmb().id, body.reason); return { ok: true }; });
  route("GET", "/api/ambassador/tours", "ambassador", () => {
    const a = myAmb(), start = B.localSlot(B.todayLocal(), "00:00");
    const gs = B.DB.groups.filter((g) => g.ambassador_id === a.id && ["com_embaixador", "realizado"].includes(g.status)).sort((x, y) => B.parse(x.slot_start) - B.parse(y.slot_start));
    const upcoming = gs.filter((g) => B.parse(g.slot_start) >= start).map((g) => groupForAmb(g, a.id));
    const past = gs.filter((g) => B.parse(g.slot_start) < start).map((g) => groupForAmb(g, a.id)).reverse();
    return { upcoming, past: past.slice(0, 30), pending_attendance: past.filter((t) => t.people.some((p) => p.status === "presenca_pendente")) };
  });
  const ambGroup = (id) => { const a = myAmb(), g = B.byId("groups", +id); if (!g || g.ambassador_id !== a.id) throw new B.DomainError("Tour não encontrado.", "nao_encontrado", 404); return [a, g]; };
  route("POST", "/api/ambassador/tours/(?<id>\\d+)/attendance", "ambassador", (q, body, p) => { const [a, g] = ambGroup(p.id); B.markAttendance(g.id, body.marks || [], "ambassador", a.id); return { ok: true }; });
  route("POST", "/api/ambassador/tours/(?<id>\\d+)/gift-collected", "ambassador", (q, body, p) => {
    const [a, g] = ambGroup(p.id); const gift = B.DB.gifts.find((x) => x.tour_group_id === g.id && x.ambassador_id === a.id);
    if (gift) gift.collected_at = body.collected ? B.now() : null;
    return { ok: true };
  });
  route("POST", "/api/ambassador/tours/(?<id>\\d+)/withdraw", "ambassador", (q, body, p) => { const [a, g] = ambGroup(p.id); B.withdraw(g.id, a.id, body.reason); return { ok: true }; });
  route("GET", "/api/ambassador/tours/(?<id>\\d+)/nps-group", "ambassador", (q, b, p) => {
    const [, g] = ambGroup(p.id);
    return { date_label: B.fmtDate(B.parse(g.slot_start)), people: B.groupBookings(g.id, false).filter((x) => ["confirmado", "realizado", "presenca_pendente", "encerrado"].includes(x.status))
      .map((x) => ({ first_name: B.firstName(B.full(x.id).full_name), token: tokenOf(x.id), answered: B.DB.nps.some((n) => n.booking_id === x.id) })) };
  });

  // Admissões
  function adminGroup(g) {
    const ms = B.parse(g.slot_start);
    const bs = B.groupBookings(g.id, false).filter((b) => !b.status.startsWith("cancelado")).map((b) => B.full(b.id));
    const amb = g.ambassador_id && B.byId("ambassadors", g.ambassador_id);
    const inv = B.DB.invitations.find((i) => i.tour_group_id === g.id && i.status === "enviado");
    return { id: g.id, slot_start: g.slot_start, date_label: B.fmtDate(ms), time_label: B.fmtTime(ms), status: g.status, in_exception: !!g.in_exception,
      handled_by_admissions: !!g.handled_by_admissions, capacity: g.capacity, people: bs.reduce((s, b) => s + b.party_size, 0), ambassador: amb ? amb.display_name : null,
      ambassador_id: g.ambassador_id, pending_invite: inv ? { ambassador: B.byId("ambassadors", inv.ambassador_id).display_name, expires_at: inv.expires_at } : null,
      bookings: bs.map((b) => ({ id: b.id, protocol: b.protocol, name: b.full_name, party_size: b.party_size, status: b.status, course: b.course_interest })) };
  }
  route("GET", "/api/admin/dashboard", "admissions", (q) => {
    const d = B.dashboard(q.from, q.to), today = B.todayLocal(), s = B.localSlot(today, "00:00");

  route("GET", "/api/admin/groups/(?<id>\\d+)/available-ambassadors", "admissions", (q, b, p) => {

  async function api(method, url, body) {
    const [path, qs] = url.split("?");
    const q = Object.fromEntries(new URLSearchParams(qs || ""));
    for (const [m, rx, role, fn] of routes) {
      if (m !== method) continue;
      const match = path.match(rx);
      if (!match) continue;
      if (role) {
        const u = me();
        if (!u || u.role !== role) { const e = new Error(role === "admissions" ? "Entre como Admissões na barra de simulação." : "Escolha um embaixador na barra de simulação."); e.status = 401; e.code = "nao_autenticado"; e.fields = {}; throw e; }
      }
      try {

        try {
          const res = fn(q, body || {}, match.groups || {});
          if (method !== "GET") B.save();
          return JSON.parse(JSON.stringify(res));

<script>
/* Gerado por build_pages.py a partir de static/*.js. Não edite à mão. */
window.Pages = window.Pages || {};
/* Utilitários compartilhados pelas páginas. */
(function () {
  const TZ = "America/Sao_Paulo";

  // As telas montam conteúdo com condicionais (cond ? nó : null). Sem isto, append() escreveria "null" na página.
  const nativeAppend = Element.prototype.append;
  Element.prototype.append = function (...nodes) {
    return nativeAppend.apply(this, nodes.flat(Infinity).filter((n) => n !== null && n !== undefined && n !== false));
  };

  async function api(method, url, body) {
    const opts = { method, headers: {}, credentials: "same-origin" };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return window.MockAPI.api(method, url, body);
  }

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.assign(el.dataset, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  const dtf = (opts) => new Intl.DateTimeFormat("pt-BR", Object.assign({ timeZone: TZ }, opts));
  const fmt = {
    date: (iso) => dtf({ day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(iso)),
    dateLong: (iso) => dtf({ weekday: "long", day: "numeric", month: "long" }).format(new Date(iso)),
    dateTime: (iso) => iso ? dtf({ day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date(iso)) : "—",
    time: (iso) => { const p = dtf({ hour: "2-digit", minute: "2-digit" }).format(new Date(iso)).split(":"); return p[1] === "00" ? `${+p[0]}h` : `${+p[0]}h${p[1]}`; },
    hhmm: (t) => { const [a, b] = t.split(":"); return b === "00" ? `${+a}h` : `${+a}h${b}`; },
    weekdayShort: (dateStr) => dtf({ weekday: "short" }).format(new Date(dateStr + "T12:00:00-03:00")).replace(".", ""),
    dayMonth: (dateStr) => dtf({ day: "numeric", month: "short" }).format(new Date(dateStr + "T12:00:00-03:00")).replace(".", ""),
    num: (v, d = 1) => (v === null || v === undefined) ? "—" : Number(v).toLocaleString("pt-BR", { maximumFractionDigits: d }),
    duration: (secs) => {
      if (secs === null || secs === undefined) return "—";
      if (secs < 90) return `${Math.round(secs)} s`;
      if (secs < 5400) return `${Math.round(secs / 60)} min`;
      if (secs < 172800) return `${fmt.num(secs / 3600)} h`;
      return `${fmt.num(secs / 86400)} dias`;
    },
  };

  const STATUS = {
    aguardando_embaixador: ["Aguardando embaixador", "yellow"], confirmado: ["Confirmado", "ok"], excecao: ["Exceção", "err"],
    realizado: ["Realizado", "dark"], encerrado: ["Encerrado", ""], nao_compareceu: ["Não compareceu", "err"],
    presenca_pendente: ["Presença pendente", "yellow"], cancelado_candidato: ["Cancelado (candidato)", ""],
    cancelado_admissoes: ["Cancelado (Admissões)", ""], aberto: ["Aberto", "yellow"], com_embaixador: ["Com embaixador", "ok"],
    cancelado: ["Cancelado", ""], enviado: ["Enviado", "info"], aceito: ["Aceito", "ok"], recusado: ["Recusado", "err"],
    expirado: ["Expirado", "err"], pendente: ["Na fila", ""], desistiu: ["Desistiu", "err"], simulado: ["Simulado", "info"], falhou: ["Falhou", "err"],
    ok: ["OK", "ok"],
  };
  function tag(status) {
    const [label, cls] = STATUS[status] || [status, ""];
    return h("span", { class: "tag " + cls }, label);
  }

  let toastTimer;
  function toast(msg, isError) {
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const t = h("div", { class: "toast" + (isError ? " error" : ""), role: "status", "aria-live": "polite" }, msg);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 4500);
  }

  function maskCPF(v) {
    const d = v.replace(/\D/g, "").slice(0, 11);
    return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }
  function cpfValid(v) {
    const d = v.replace(/\D/g, "");
    if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
    for (const n of [9, 10]) {
      let s = 0;
      for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i);
      if ((s * 10) % 11 % 10 !== +d[n]) return false;
    }
    return true;
  }
  function maskPhone(v) {
    let d = v.replace(/\D/g, "");
    let prefix = "";
    if (d.startsWith("55") && d.length > 11) { prefix = "+55 "; d = d.slice(2); }
    d = d.slice(0, 11);
    if (d.length <= 2) return prefix + d;
    if (d.length <= 6) return `${prefix}(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `${prefix}(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `${prefix}(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  }

  function dialog(title, body, actions) {

            h("button", { class: "btn small", onclick: async () => { await api("POST", `/api/admin/templates/${t.code}/reset`); toast("Texto padrão restaurado."); render(); } }, "Restaurar padrão")))));

  const SECTIONS = [
    ["visao", "Visão geral", secVisao], ["agenda", "Agenda", secAgenda], ["agendamentos", "Agendamentos", secAgendamentos],
    ["excecoes", "Exceções", secExcecoes], ["embaixadores", "Embaixadores", secEmbaixadores], null,
    ["config", "Configurações", secConfig], ["mensagens", "Mensagens", secMensagens],

  function drawSide() {
    const ICON = { visao: "home", agenda: "calendar", agendamentos: "list", excecoes: "alert", embaixadores: "users", config: "sliders", mensagens: "message", saude: "play" };
    clear(side).append(...SECTIONS.map((s) => s === null ? h("div", { class: "sep" }) : h("button", { "aria-current": S.section === s[0] ? "page" : null, onclick: () => go(s[0]) },

<script>
/* Casca do simulador: barra de papéis e relógio, navegação entre telas, mensagens enviadas e painel de simulação. */
(function () {
  const { h, clear, toast, dialog, fmt, tag } = T;

    [/^\/candidato$/, candidateHome, "lp"],

    [/^\/minha-visita\/[\w-]+$/, "minha-visita", "wrap narrow"],
    [/^\/nps\/(grupo\/)?[\w-]+$/, "nps", "wrap narrow"],
    [/^\/embaixador$/, "embaixador", "wrap", "ambassador"],
    [/^\/admin$/, "admin", "app", "admissions"],
    [/^\/mensagens$/, inbox, "wrap"],

  const PERSONA_OF = { "/embaixador": "embaixador", "/admin": "admissoes", "/mensagens": "mensagens" };

  function nav(url) {
    const [path, qs] = url.split("?");
    current = { path, search: qs ? "?" + qs : "", tab: tabs[path] || null, setTab: (id) => { tabs[path] = id; current.tab = id; } };
    const r = ROUTES.find(([rx]) => rx.test(path)) || ROUTES[0];
    const [, page, layout, role] = r;
    const user = window.MockAPI.me();
    if (role && (!user || user.role !== role)) {
      if (role === "admissions") return setPersona("admissoes");
      return setPersona("embaixador");
    }
    clear(view);
    const top = h("div", { id: "top" });
    if (layout === "app") view.append(top, h("div", { class: "app" }, h("nav", { class: "side", id: "side", "aria-label": "Seções do painel" }), h("main", { id: "conteudo", class: "main" })));
    else view.append(top, h("main", { id: "conteudo", class: layout === "lp" ? "lp" : layout }, h("div", { id: "app" })));
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + (PERSONA_OF[path] || "candidato")); } catch (e) { /* ignora */ }
    if (typeof page === "function") page(current);
    else window.Pages[page](current);
    drawBar();
  }
  window.nav = nav;
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");

  });

  // ------------------------------------------------------------ barra de simulação
  let users = null;

    users = users || await api("GET", "/api/sim/users");
    if (p === "admissoes") { await window.MockAPI.api("POST", "/api/sim/persona", { persona: p, userId: users.admissions[0].id }); return nav("/admin"); }

      const sess = window.Backend.DB.session || {};
      const chosen = ambId || (sess.persona === "embaixador" && sess.ambId) || (users.ambassadors.find((a) => a.pending) || users.ambassadors[0]).id;
      const a = users.ambassadors.find((x) => x.id === +chosen);
      await window.MockAPI.api("POST", "/api/sim/persona", { persona: p, userId: a.user_id });
      window.Backend.DB.session.ambId = a.id;
      return nav("/embaixador");
    }
    await window.MockAPI.api("POST", "/api/sim/persona", { persona: p, userId: null });
    nav(p === "mensagens" ? "/mensagens" : "/");
  }

  async function drawBar() {
    users = await api("GET", "/api/sim/users");
    const st = await api("GET", "/api/sim/state");

    const pendingTotal = users.ambassadors.reduce((s, a) => s + a.pending, 0);
    const clock = async (body, msg) => {
      try { const r = await api("POST", "/api/sim/clock", body); toast(`${msg} Agora: ${fmt.dateTime(r.now)}.`); nav(current.path + current.search); }
      catch (e) { toast(e.message, true); }

    clear(bar).append(h("div", { class: "simbar-inner" },
      h("div", { class: "sim-label" }, h("strong", {}, "Simulador"), h("span", {}, "dados fictícios, salvos só neste navegador")),
      h("div", { class: "seg sim-personas", role: "group", "aria-label": "Ver a plataforma como" },
        btn("candidato", "Candidato"), btn("embaixador", `Embaixador${pendingTotal ? ` (${pendingTotal})` : ""}`), btn("admissoes", "Admissões"), btn("mensagens", "Mensagens")),
      persona === "embaixador" ? ambSel : null,
      persona === "candidato" ? h("button", { class: "btn small", onclick: visitsDialog }, T.icon("list", 16), "Abrir uma visita") : null,

        h("button", { class: "btn small", onclick: () => clock({ hours: 1 }, "Relógio +1 hora.") }, "+1 h"),
        h("button", { class: "btn small", onclick: () => clock({ hours: 24 }, "Relógio +1 dia.") }, "+1 dia"),
        h("button", { class: "btn small", onclick: () => clock({ to_next_tour: true, ambassador_id: persona === "embaixador" ? sess.ambId : null }, persona === "embaixador" ? "Pulou para o fim do seu próximo tour." : "Pulou para o fim do próximo tour.") }, "Próximo tour"),
        st.offset_hours ? h("button", { class: "btn small ghost", onclick: () => clock({ reset: true }, "Relógio voltou para agora.") }, "Agora") : null)));
  }
  // atalho de teste: no sistema real o candidato chega à "Minha visita" pelo link do e-mail

      examples.length ? [h("h3", { style: "font-family:var(--sans);font-size:15px;margin-top:20px" }, "Exemplos"), list(examples)] : null));
  }

  // atalho de teste: faz o papel do celular do candidato que lê o QR mostrado pelo embaixador
  async function groupNpsDialog() {

        T.icon("qr", 20), h("span", {}, `${t.date_label.split(",")[0]}, ${t.time_label}`, h("small", {}, `${t.date_label.split(",").slice(1).join(",").trim()} · ${t.people_count} pessoa(s)`)), T.icon("arrow", 18))))

    if (method !== "GET" && !url.startsWith("/api/sim/persona")) setTimeout(drawBar, 0);

  // ------------------------------------------------------------ página do candidato (início)

  async function inbox() {
    document.getElementById("top").append(T.topbar("Mensagens enviadas"));

          list.querySelectorAll(".item").forEach((x) => x.removeAttribute("aria-current")); b.setAttribute("aria-current", "true");
          clear(detail).append(h("article", { class: "card" }, h("h2", {}, n.subject),
            h("p", { class: "muted" }, `Para ${n.recipient} · ${n.channel === "whatsapp" ? "WhatsApp (simulado)" : "E-mail"} · ${n.template_code} · ${fmt.dateTime(n.sent_at)}`),
            h("div", { class: "mail-body" }, n.body_text)));
        } }, h("span", { class: "item-head" }, h("strong", {}, n.recipient), h("span", { class: "tag" + (n.channel === "whatsapp" ? " info" : "") }, n.channel === "whatsapp" ? "WhatsApp" : n.template_code)),
          h("span", {}, n.subject), h("small", {}, fmt.dateTime(n.sent_at)));
        list.append(b);
      });
    };
    filter.addEventListener("input", draw);
    app.append(h("div", { class: "section-title" }, h("h1", {}, "Mensagens enviadas"), filter),
      h("p", { class: "muted" }, "Na plataforma real, estes e-mails saem pelo servidor do Insper. O WhatsApp aparece como simulado até a conta oficial ser aprovada."),
      h("div", { class: "inbox" }, list, detail));
    items = (await api("GET", "/api/dev/inbox")).items;
    draw();
  }

  // ------------------------------------------------------------ painel de simulação (seção de Admissões)
  window.secSimulacao = async function (el) {
    const st = await api("GET", "/api/sim/state");
    const num = (id, label, value, min, max) => h("div", { class: "field" }, h("label", { for: id }, label), h("input", { type: "number", id, value, min, max }));
    const run = async (url, body, msg) => {
      try { const r = await api("POST", url, body); toast(msg(r)); document.querySelectorAll("dialog[open]").forEach((d) => d.close()); nav(current.path + current.search); }
      catch (e) { toast(e.message, true); }
    };
    const v = (id) => +document.getElementById(id).value;
    el.append(
      h("p", { class: "muted" }, "Gere cenários para testar a plataforma com volume. Base AS-IS (Marcelo, até 19/10/2026): 767 agendamentos, 63% realizados, cerca de 50 embaixadores, até 10 pessoas por tour. Demanda distribuída como nos dados: sexta > quinta > segunda > terça > quarta; 15h > 10h > 17h > 14h > 16h."),
      h("div", { class: "grid2", style: "gap:16px" },
        h("section", { class: "card" }, h("h2", {}, "1. Gerar demanda"), h("p", { class: "muted" }, "Cria agendamentos de candidatos fictícios pelo fluxo real (vagas, grupos, convites e e-mails)."),
          h("div", { class: "toolbar" }, num("sim-n", "Agendamentos", 30, 1, 500), num("sim-days", "Nos próximos (dias)", 14, 2, 60),
            h("button", { class: "btn primary", onclick: () => run("/api/sim/demand", { count: v("sim-n"), days: v("sim-days") }, (r) => `${r.made} agendamentos criados${r.full ? ` · ${r.full} tentativas em horários esgotados` : ""}.`) }, "Gerar"))),
        h("section", { class: "card" }, h("h2", {}, "2. Embaixadores respondem"), h("p", { class: "muted" }, "Cada convite em aberto é aceito, recusado (passa ao próximo da fila) ou fica sem resposta (expira com o relógio)."),
          h("div", { class: "toolbar" }, num("sim-acc", "Aceitam (%)", 70, 0, 100), num("sim-dec", "Recusam (%)", 15, 0, 100),
            h("button", { class: "btn primary", onclick: () => run("/api/sim/respond", { accept: v("sim-acc"), decline: v("sim-dec") }, (r) => `${r.accepted} aceites e ${r.declined} recusas.`) }, "Responder convites"))),
        h("section", { class: "card" }, h("h2", {}, "3. Tours acontecem"), h("p", { class: "muted" }, "Para os tours que já começaram no relógio da simulação: marca presença com a taxa de faltas e responde o NPS."),
          h("div", { class: "toolbar" }, num("sim-ns", "Faltas (%)", 15, 0, 100), num("sim-nps", "Respondem o NPS (%)", 60, 0, 100),
            h("button", { class: "btn primary", onclick: () => run("/api/sim/tour-day", { no_show: v("sim-ns"), nps: v("sim-nps") }, (r) => r.marked ? `${r.marked} presenças marcadas e ${r.answered} NPS respondidos.` : "Nenhum tour começou ainda. Avance o relógio.") }, "Simular tours"))),
        h("section", { class: "card" }, h("h2", {}, "4. Relógio e jobs"), h("p", { class: "muted" }, `Agora na simulação: ${fmt.dateTime(st.now)}${st.offset_hours ? ` (+${fmt.num(st.offset_hours)} h)` : ""}. Cada avanço roda os jobs automáticos.`),
          h("div", { class: "btns" },
            [[6, "+6 h"], [24, "+1 dia"], [72, "+3 dias"], [168, "+7 dias"]].map(([hrs, l]) => h("button", { class: "btn", onclick: () => run("/api/sim/clock", { hours: hrs }, (r) => `Agora: ${fmt.dateTime(r.now)}.`) }, l)),
            h("button", { class: "btn ghost", onclick: () => run("/api/sim/clock", { reset: true }, () => "Relógio voltou para agora.") }, "Voltar para agora")))),
      h("h2", { style: "margin-top:28px" }, "Últimas execuções dos jobs"),
      st.jobs.length ? h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Job"), h("th", {}, "Quando"), h("th", {}, "Situação"), h("th", { class: "num" }, "Resultado"))),
        h("tbody", {}, st.jobs.map((j) => h("tr", {}, h("td", {}, h("code", {}, j.job)), h("td", {}, fmt.dateTime(j.started_at)), h("td", {}, tag(j.status === "ok" ? "ok" : "falhou")), h("td", { class: "num" }, j.detail))))))
        : h("div", { class: "empty" }, "Nenhuma execução ainda."),
      h("section", { class: "card danger-zone", style: "margin-top:28px" }, h("h2", {}, "Reiniciar dados"),
        h("p", { class: "muted" }, "Apaga tudo o que foi feito neste navegador e recria os dados de exemplo: 12 embaixadores, 60 agendamentos no último mês e 40 nas próximas duas semanas."),
        h("button", { class: "btn danger", onclick: async () => {
          if (!(await T.confirmDialog("Reiniciar dados", "Apagar a simulação deste navegador e recriar os dados de exemplo?", "Reiniciar", true))) return;
          await api("POST", "/api/sim/reset"); toast("Dados recriados."); document.querySelectorAll("dialog[open]").forEach((d) => d.close()); setPersona("candidato");
        } }, "Reiniciar dados")));
  };

  // ------------------------------------------------------------ calendário e CSV (downloads ficam bloqueados no artifact: mostramos o conteúdo para copiar)
  function copyBox(title, text, note) {
    const ta = h("textarea", { id: "copy-box", rows: "12", readonly: true, style: "font-family:ui-monospace,Menlo,monospace;font-size:13px" }, text);
    const dlg = dialog(title, h("div", {}, note ? h("p", { class: "muted" }, note) : null, ta), [
      h("button", { class: "btn primary", onclick: async () => {
        try { await navigator.clipboard.writeText(text); toast("Copiado."); } catch (e) { ta.select(); toast("Selecionado. Use Ctrl+C / Cmd+C para copiar."); }
      } }, "Copiar"), h("button", { class: "btn", onclick: () => dlg.close() }, "Fechar")]);
  }
  window.showIcs = (v) => {
    const s = new Date(v.slot_start), e = new Date(+s + 60 * 60e3), f = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    copyBox("Convite de calendário (.ics)", ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Insper//Agendamento de Tour//PT-BR", "BEGIN:VEVENT", `UID:${v.protocol}@tour.insper`,
      `DTSTART:${f(s)}`, `DTEND:${f(e)}`, "SUMMARY:Visita ao campus do Insper", `LOCATION:${v.meeting_point}`, `DESCRIPTION:Protocolo ${v.protocol}. Leve um documento com foto.`, "END:VEVENT", "END:VCALENDAR"].join("\n"),
    "Na plataforma real, o e-mail de confirmação traz este arquivo anexado e o botão baixa o .ics.");
  };
  window.showCsv = async (kind, params) => {
    const r = await api("GET", `/api/admin/export/${kind}?${params || ""}`);
    copyBox("Exportação CSV", r.csv, "Na plataforma real, o botão baixa o arquivo .csv. Aqui, copie e cole numa planilha (separador: ponto e vírgula).");
  };

  // ------------------------------------------------------------ início
  window.MockAPI.boot();
  setInterval(() => { try { window.Backend.runJobs(); window.Backend.save(); } catch (e) { /* ignora */ } }, 60000);
  const start = (location.hash || "").slice(1);
  const sess = window.Backend.DB.session || {};
  if (start === "admissoes") setPersona("admissoes");
  else if (start === "embaixador") setPersona("embaixador");
  else if (start === "mensagens") setPersona("mensagens");
  else if (start === "candidato") setPersona("candidato");
  else if (sess.persona && sess.persona !== "inicio" && start !== "inicio") setPersona(sess.persona === "admissoes" ? "admissoes" : sess.persona, sess.ambId);
  else setPersona("candidato");
})();

</script>
</html>
